<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gut Run</title>
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="ad">
    <canvas class="ad__canvas" width="720" height="1280" tabindex="-1" aria-label="Gut Run game"></canvas>
    <img class="ad__logo" src="assets/logo.png" width="360" height="640" alt="YOUR LOGO">
    <section class="screen screen--start">
      <img class="screen__layer screen__headline" src="assets/01_game/tut.png" width="360" height="640" alt="Bringe Poo durch den Darm ans Ziel.">
      <img class="screen__gesture" src="assets/gesture.png" width="86.5" height="96" alt="tap to run">
    </section>
    <section class="screen screen--fail" hidden>
      <img class="screen__layer screen__bubble" src="assets/02_endcard/fail/bubble.png" width="360" height="640" alt="">
      <img class="screen__layer screen__bacteria" src="assets/02_endcard/fail/bac1 (1).png" width="360" height="640" alt="">
      <img class="screen__layer screen__bacteria" src="assets/02_endcard/fail/bac2.png" width="360" height="640" alt="">
      <img class="screen__layer screen__bacteria" src="assets/02_endcard/fail/bac3.png" width="360" height="640" alt="">
      <img class="screen__layer screen__bacteria" src="assets/02_endcard/fail/bac4.png" width="360" height="640" alt="">
      <img class="screen__layer screen__bacteria" src="assets/02_endcard/fail/bac5.png" width="360" height="640" alt="">
      <img class="screen__layer screen__poo" src="assets/02_endcard/fail/sad.png" width="360" height="640" alt="">
      <img class="screen__layer screen__headline" src="assets/02_endcard/fail/hl.png" width="360" height="640" alt="Poo, das tat weh! Erfahre jetzt, was deinem Darm guttut.">
      <a class="screen__cta screen__cta--fail" href="https://example.com/landing" target="_blank" rel="noopener noreferrer"><img src="assets/02_endcard/fail/cta.png" width="186" height="38.5" alt="Jetzt informieren!"></a>
      <button class="screen__replay" type="button"><img src="assets/02_endcard/fail/replay.png" width="185.5" height="40.5" alt="Nochmal spielen"></button>
    </section>
    <section class="screen screen--win" hidden>
      <img class="screen__layer screen__bubble" src="assets/02_endcard/win/bubble.png" width="360" height="640" alt="">
      <img class="screen__layer screen__confetti" src="assets/02_endcard/win/konfetti.png" width="360" height="640" alt="">
      <img class="screen__layer screen__poo" src="assets/02_endcard/win/happy.png" width="360" height="640" alt="">
      <img class="screen__layer screen__headline" src="assets/02_endcard/win/hl.png" width="360" height="640" alt="Poo, tut das gut! Wenn du weißt, was dein Darm braucht.">
      <a class="screen__cta screen__cta--win" href="https://example.com/landing" target="_blank" rel="noopener noreferrer"><img src="assets/02_endcard/win/cta.png" width="214" height="45.5" alt="Jetzt mehr erfahren!"></a>
    </section>
    <button class="mute" type="button" aria-label="Ton aus" aria-pressed="false"><span class="mute__icon" aria-hidden="true">🔊</span></button>
  </main>
  <script src="lib/gsap.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
</body>

</html>
