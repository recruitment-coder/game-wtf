<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gut Run</title>
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="ad">
    <canvas class="ad__canvas" width="720" height="1280" aria-label="Gut Run game"></canvas>
    <div class="screen screen--start">
      <img class="screen__layer screen__layer--background" src="assets/bg.jpg" width="360" height="640" alt="">
      <img class="screen__layer screen__layer--texture" src="assets/01_game/bg_texture.png" width="360" height="640" alt="">
      <img class="screen__layer screen__layer--gut" src="assets/01_game/gameplay.png" width="2528" height="640" alt="">
      <div class="screen__header"></div>
      <img class="screen__layer screen__layer--bac6" src="assets/01_game/bac6.png" width="38" height="35" alt="">
      <img class="screen__layer screen__layer--bac2" src="assets/01_game/bac2.png" width="26.5" height="70" alt="">
      <img class="screen__layer screen__layer--stress" src="assets/01_game/txt1.png" width="23" height="94" alt="Stress">
      <img class="screen__layer screen__layer--txt2" src="assets/01_game/txt2.png" width="34" height="113" alt="Tabu">
      <img class="screen__layer screen__layer--border" src="assets/border.png" width="360" height="640" alt="">
      <img class="screen__layer screen__layer--logo" src="assets/logo.png" width="360" height="640" alt="YOUR LOGO">
      <img class="screen__layer screen__layer--tutorial" src="assets/01_game/tut.png" width="360" height="640" alt="Bringe Poo durch den Darm ans Ziel.">
      <img class="screen__layer screen__layer--gesture" src="assets/gesture.png" width="86.5" height="96" alt="tab to run">
      <img class="screen__layer screen__layer--player" src="assets/01_game/player.png" width="42" height="41" alt="">
    </div>
  </main>
  <script src="lib/gsap.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
</body>

</html>
